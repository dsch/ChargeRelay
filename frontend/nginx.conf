server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Firmware uploads are streamed to the API, which enforces FW_MAX_UPLOAD_MB.
        # Keep this above that limit (nginx's 1 MB default would reject uploads).
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        set $upstream http://ocpp-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
